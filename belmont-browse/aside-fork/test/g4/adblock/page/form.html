<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>문의 폼 (검사용)</title></head>
<body><h1>문의하기</h1>
<form id="contact" method="get" action="/submitted.html">
 <p><label>이름 <input name="name" required></label></p>
 <p><label>이메일 <input name="email" type="email" required></label></p>
 <p><label>전화 <input name="phone" type="tel"></label></p>
 <p><label>문의 종류 <select name="kind"><option>일반</option><option>제휴</option><option>환불</option></select></label></p>
 <p><label>내용 <textarea name="message" rows="4" cols="40"></textarea></label></p>
 <p><label><input type="checkbox" name="agree"> 개인정보 처리에 동의</label></p>
 <p><button type="submit" id="submit">제출</button></p>
</form>
<p id="status">아직 제출되지 않음</p>
</body></html>
