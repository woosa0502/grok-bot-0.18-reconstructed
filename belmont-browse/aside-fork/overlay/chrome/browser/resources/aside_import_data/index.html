<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aside Importer</title>
    <style>
      :root {
        color-scheme: dark;
        --window-bg: rgba(24, 24, 27, 0.7);
        --window-base-bg: #18181b;
        --panel-bg: rgba(255, 255, 255, 0.03);
        --panel-active-bg: rgba(255, 255, 255, 0.08);
        --primary-fg: rgba(255, 255, 255, 0.85);
        --secondary-fg: rgba(255, 255, 255, 0.55);
        --border-fg: rgba(255, 255, 255, 0.25);
        --button-bg: #fafafa;
        --button-fg: #0a0a0a;
        --font-family: "SF Pro Display", "SF Pro Text", -apple-system,
          BlinkMacSystemFont, sans-serif;
      }

      html,
      body {
        background: var(--window-base-bg);
        height: 100%;
        margin: 0;
        overflow: hidden;
        width: 100%;
      }

      body {
        font-family: var(--font-family);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
      }

      img {
        display: block;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      main {
        backdrop-filter: blur(36px);
        background: var(--window-bg);
        box-sizing: border-box;
        box-shadow: 0 16px 36px 3px rgba(0, 0, 0, 0.5);
        height: 100%;
        overflow: hidden;
        position: relative;
        width: 100%;
      }

      .drag-strip {
        -webkit-app-region: drag;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
        height: 28px;
        z-index: 3;
      }

      .browser-copy {
        -webkit-app-region: no-drag;
        bottom: 0;
        left: 0;
        position: absolute;
        top: 34px;
        width: 412px;
      }

      .copy-group {
        left: 30px;
        position: absolute;
        top: 21px;
        width: 306px;
      }

      .title {
        color: var(--primary-fg);
        font-size: 28px;
        font-weight: 500;
        line-height: 30px;
        margin: 0;
      }

      .description {
        color: var(--secondary-fg);
        font-size: 15px;
        font-weight: 400;
        line-height: 22px;
        margin: 10px 0 0;
        width: 304px;
      }

      .import-button {
        -webkit-appearance: none;
        -webkit-app-region: no-drag;
        align-items: center;
        appearance: none;
        background: var(--button-bg);
        border: 0;
        border-radius: 13px;
        bottom: 26px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        color: var(--button-fg);
        cursor: default;
        display: inline-flex;
        font-family: var(--font-family);
        font-size: 15px;
        font-weight: 400;
        justify-content: center;
        line-height: 17px;
        padding: 8px 20px;
        position: absolute;
        right: 26px;
        transition: none;
      }

      .import-button:disabled {
        background: rgba(255, 255, 255, 0.16);
        box-shadow: none;
        color: rgba(255, 255, 255, 0.4);
      }

      .browser-list {
        -webkit-app-region: no-drag;
        background: var(--panel-bg);
        border-radius: 8px;
        bottom: 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 4px;
        justify-content: flex-start;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 16px 14px;
        position: absolute;
        right: 12px;
        scrollbar-gutter: stable;
        top: 12px;
        width: 296px;
      }

      .safari-guide-host {
        -webkit-app-region: no-drag;
        inset: 0;
        pointer-events: none;
        position: absolute;
        z-index: 4;
      }

      .safari-guide-overlay {
        align-items: center;
        background: rgba(9, 10, 14, 0.58);
        display: flex;
        inset: 0;
        justify-content: center;
        pointer-events: auto;
        position: absolute;
      }

      .safari-guide-modal {
        background: #151519;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.42);
        box-sizing: border-box;
        display: grid;
        gap: 20px;
        grid-template-columns: 252px minmax(0, 1fr);
        min-height: 372px;
        padding: 18px 18px 18px 18px;
        position: relative;
        width: 640px;
      }

      .safari-guide-close {
        align-items: center;
        appearance: none;
        background: rgba(255, 255, 255, 0.07);
        border: 0;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.78);
        cursor: default;
        display: inline-flex;
        font-family: var(--font-family);
        font-size: 18px;
        height: 28px;
        justify-content: center;
        line-height: 1;
        padding: 0;
        position: absolute;
        right: 14px;
        top: 14px;
        width: 28px;
      }

      .safari-guide-close span {
        display: block;
        line-height: 1;
        transform: translateY(-1px);
      }

      .safari-guide-art {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 12px;
        display: flex;
        min-height: 0;
        overflow: hidden;
      }

      .safari-guide-art img {
        height: 100%;
        object-fit: cover;
        object-position: left center;
        width: 100%;
      }

      .safari-guide-copy {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 14px 10px 12px 4px;
      }

      .safari-guide-eyebrow {
        color: rgba(255, 255, 255, 0.48);
        font-size: 12px;
        font-weight: 500;
        line-height: 14px;
      }

      .safari-guide-title {
        color: var(--primary-fg);
        font-size: 26px;
        font-weight: 500;
        line-height: 30px;
        margin: 10px 0 0;
      }

      .safari-guide-description {
        color: rgba(255, 255, 255, 0.62);
        font-size: 14px;
        font-weight: 400;
        line-height: 21px;
        margin: 12px 0 0;
        max-width: 312px;
      }

      .safari-guide-description strong,
      .safari-guide-step-text strong {
        color: rgba(255, 255, 255, 0.88);
        font-weight: 500;
      }

      .safari-guide-steps {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
      }

      .safari-guide-step {
        align-items: flex-start;
        background: rgba(255, 255, 255, 0.035);
        border-radius: 14px;
        display: flex;
        gap: 10px;
        padding: 10px 12px;
      }

      .safari-guide-step-number {
        align-items: center;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.82);
        display: inline-flex;
        flex: none;
        font-size: 12px;
        font-weight: 500;
        height: 20px;
        justify-content: center;
        line-height: 12px;
        width: 20px;
      }

      .safari-guide-step-text {
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        font-weight: 400;
        line-height: 19px;
        padding-top: 1px;
      }

      .safari-zip-input {
        display: none;
      }

      .safari-guide-file-block {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 18px;
        padding-top: 4px;
      }

      .safari-select-button {
        appearance: none;
        background: rgba(255, 255, 255, 0.96);
        border: 0;
        border-radius: 12px;
        color: #09090b;
        cursor: default;
        display: inline-flex;
        font-family: var(--font-family);
        font-size: 14px;
        font-weight: 500;
        justify-content: center;
        line-height: 18px;
        padding: 11px 16px;
        pointer-events: auto;
        text-align: center;
      }

      .safari-selected-file {
        color: rgba(255, 255, 255, 0.42);
        font-size: 12px;
        font-weight: 400;
        line-height: 17px;
        min-height: 17px;
      }

      .safari-selected-file.is-visible {
        color: rgba(255, 255, 255, 0.62);
      }

      .safari-selected-file span {
        color: rgba(255, 255, 255, 0.88);
      }

      .safari-validation-overlay {
        align-items: center;
        background: rgba(9, 10, 14, 0.44);
        display: flex;
        inset: 0;
        justify-content: center;
        pointer-events: auto;
        position: absolute;
      }

      .safari-validation-dialog {
        background: #151519;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.36);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 320px;
        padding: 20px 20px 18px;
      }

      .safari-validation-message {
        color: rgba(255, 255, 255, 0.82);
        font-size: 14px;
        font-weight: 400;
        line-height: 21px;
        margin: 0;
        max-width: 320px;
      }

      .safari-validation-button {
        align-self: flex-end;
        appearance: none;
        background: rgba(255, 255, 255, 0.96);
        border: 0;
        border-radius: 11px;
        color: #09090b;
        cursor: default;
        display: inline-flex;
        font-family: var(--font-family);
        font-size: 14px;
        font-weight: 500;
        justify-content: center;
        line-height: 18px;
        min-width: 74px;
        padding: 9px 16px;
      }

      .browser-list.is-loading {
        opacity: 0;
        pointer-events: none;
      }

      .browser-option {
        align-items: center;
        background: transparent;
        border-radius: 15px;
        box-sizing: border-box;
        display: flex;
        gap: 10px;
        height: 68px;
        padding: 2px 10px 2px 4px;
        transition: background-color 120ms ease;
        width: 100%;
      }

      .browser-option.is-disabled {
        pointer-events: none;
      }

      .browser-empty-state {
        align-items: center;
        color: var(--secondary-fg);
        display: flex;
        flex: 1 1 auto;
        font-size: 14px;
        font-weight: 400;
        justify-content: center;
        line-height: 20px;
        min-height: 100%;
        text-align: center;
      }

      .browser-option.is-selected {
        background: var(--panel-active-bg);
      }

      .icon-frame {
        align-items: center;
        border-radius: 15px;
        display: flex;
        flex: none;
        height: 60px;
        justify-content: center;
        overflow: hidden;
        width: 60px;
      }

      .icon-glyph {
        align-items: center;
        display: inline-flex;
        height: 44px;
        justify-content: center;
        width: 44px;
      }

      .icon-glyph img {
        display: block;
        height: auto;
        max-height: 44px;
        max-width: 44px;
        width: auto;
      }

      .icon-glyph--safari {
        border-radius: 999px;
        overflow: hidden;
      }

      .icon-glyph--safari img {
        height: 44px;
        max-height: none;
        max-width: none;
        object-fit: cover;
        width: 44px;
      }

      .icon-glyph--edge img {
        height: 43px;
        width: 42px;
      }

      .icon-glyph--dia {
        height: 54px;
        width: 54px;
      }

      .icon-glyph--dia img {
        height: 54px;
        max-height: none;
        max-width: none;
        width: 54px;
      }

      .browser-label {
        align-items: center;
        color: var(--primary-fg);
        display: flex;
        flex: 1 1 auto;
        font-size: 18px;
        font-weight: 400;
        line-height: 22px;
        min-width: 0;
      }

      .check-wrap {
        align-items: center;
        display: flex;
        flex: none;
        height: 22px;
        justify-content: center;
        margin-left: auto;
        width: 22px;
      }

      .check-wrap img {
        height: 12px;
        width: 16px;
      }

      .loading-indicator {
        animation: spin 800ms linear infinite;
        border: 1.5px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        border-top-color: rgba(255, 255, 255, 0.88);
        box-sizing: border-box;
        height: 16px;
        width: 16px;
      }

      .check-wrap.is-hidden {
        opacity: 0;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @media (hover: hover) {
        .import-button:not(:disabled):hover {
          background: #e9e9e9;
        }

        .browser-option:hover {
          background: rgba(255, 255, 255, 0.05);
        }

        .browser-option.is-selected:hover {
          background: rgba(255, 255, 255, 0.1);
        }

        .safari-guide-close:hover {
          background: rgba(255, 255, 255, 0.11);
        }

        .safari-select-button:hover {
          background: rgba(255, 255, 255, 0.88);
        }

        .safari-validation-button:hover {
          background: rgba(255, 255, 255, 0.88);
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="app.js"></script>
    <main aria-label="Import browser data">
      <div class="drag-strip" aria-hidden="true"></div>
      <section class="browser-copy" aria-label="Import details">
        <div class="copy-group">
          <h1 class="title">Quick import from your<br>browser</h1>
          <p class="description">
            Aside will import your saved bookmarks, browsing history, and
            passwords with a single click.
          </p>
        </div>
        <button class="import-button" type="button" disabled>Import</button>
      </section>

      <aside class="browser-list is-loading" aria-label="Available browsers"></aside>
      <div class="safari-guide-host" aria-live="polite"></div>
    </main>
  </body>
</html>
