name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the box search binary the Grep tool spawns
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep && rg --version
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Hydrate the checksum-pinned shipped runtime
        run: npm run bootstrap
      - name: Install the system tools the media and document tests spawn
        run: sudo apt-get install -y -qq ffmpeg poppler-utils bubblewrap && ffmpeg -version | head -1 && pdftotext -v 2>&1 | head -1 && bwrap --version && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 && bwrap --ro-bind / / --unshare-user --dev /dev /bin/true && echo 'bwrap user namespaces ok'
      - name: Install the browser harness's locked dependency graph
        run: npm ci --no-audit --no-fund --prefix belmont-browse
      - name: Hydrate the checksum-pinned Aside inputs
        run: npm run bootstrap:aside
      - name: Run source and publication checks
        run: npm run check
      # The extension/vendor trees these suites read are pinned in research-archives/aside and hydrated by the
      # Aside bootstrap above, so they are part of the gate like the root suite.
      - name: Run the browser harness suites
        run: npm run test:browser
      - name: Build the editable frontend
        run: npm run frontend:build
      - name: Verify a fresh clean-history export is lossless
        run: npm run publication:check
